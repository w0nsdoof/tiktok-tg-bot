<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bot control panel{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="/">TikTok Bot</a>
    <nav><a href="/users">Users</a><a href="/settings">Settings</a></nav>
    <div class="identity">{{ user.preferred_username }} · <a href="/logout">Sign out</a></div>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
